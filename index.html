<style>
/* Layout idea: phone-first operations ledger. Summary strip -> attention list -> tables. Bottom tab bar, sheets for data entry. Plates styled as Kenyan rear plates. */
:root {
  /* DRYV identity: graphite + white, signal blue for actions, ice blue for calm accents, amber for the forward mark. Wide futuristic display type over a clean geometric body. */
  color-scheme: light;
  --bg: #f3f6f9;
  --surface: #ffffff;
  --ink: #0e1116;
  --muted: #5a6573;
  --line: #dfe5ec;
  --accent: #1e6fb8;
  --accent-ink: #ffffff;
  --accent-soft: #e4f0fa;
  --ice: #8ccbea;
  --amber: #f5a524;
  --graphite: #0e1116;
  --plate: #f5c518;
  --plate-ink: #111111;
  --good: #1d7a3e;
  --good-soft: #e3f3e8;
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --font-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --font-body: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0e12; --surface: #151a21; --ink: #e8eef4; --muted: #9aa8b6; --line: #262e38;
    --accent: #5aa9e6; --accent-ink: #06121f; --accent-soft: #15283a; --ice: #8ccbea;
    --good: #5cc282; --good-soft: #17301f; --warn: #e3ad4a; --warn-soft: #33280f; --bad: #f07b72; --bad-soft: #3a1b18;
    --series-1: #3987e5; --series-2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e12; --surface: #151a21; --ink: #e8eef4; --muted: #9aa8b6; --line: #262e38;
  --accent: #5aa9e6; --accent-ink: #06121f; --accent-soft: #15283a; --ice: #8ccbea;
  --good: #5cc282; --good-soft: #17301f; --warn: #e3ad4a; --warn-soft: #33280f; --bad: #f07b72; --bad-soft: #3a1b18;
  --series-1: #3987e5; --series-2: #d95926;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; }
h1 { font-size: 18px; }
h2 { font-size: 14px; line-height: 1.35; }
h3 { font-family: var(--font-body); font-size: 15px; font-weight: 700; }
.two-tone { color: var(--accent); }
/* Brand lockup */
.logo { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.logo .sym { width: 34px; height: 34px; flex: none; }
.logo .word { height: 18px; width: auto; }
header.top .brand { gap: 4px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.app { max-width: 1100px; margin: 0 auto; padding: 0 16px 96px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
header.top .brand { display: flex; flex-direction: column; }
header.top .brand span { font-size: 12px; color: var(--muted); }
.login-hero { max-width: 440px; margin: 28px auto 0; padding: 22px; border-radius: 20px; color: #fff; background:
  radial-gradient(120% 90% at 100% 0%, rgba(140,203,234,0.55), transparent 60%), linear-gradient(160deg, #0e1116 0%, #16314c 70%, #1e6fb8 120%); }
.login-hero .hero-title { font-size: 21px; line-height: 1.35; color: #fff; }
.login-hero .two-tone { color: var(--ice); }
.login-hero .muted { color: rgba(255,255,255,0.75); }
.banner { padding: 10px 12px; border-radius: var(--radius); background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 600px; }
nav.tabs a { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12px; font-weight: 500; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a { position: relative; }
nav.tabs a.on { color: var(--accent); }
nav.tabs a.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--amber); }

.section { margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.grid { display: grid; gap: 10px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.kpi .value { font-family: var(--font-body); font-size: 25px; font-weight: 800; margin-top: 2px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.plate { display: inline-block; font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--plate); color: var(--plate-ink); padding: 1px 7px; border-radius: 4px; border: 1.5px solid #222; letter-spacing: 0.04em; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }

.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); }
.alert.bad { border-left-color: var(--bad); }
.alert .what { font-weight: 600; }
.alert .why { font-size: 13px; color: var(--muted); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; background: var(--surface); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.subrow td { background: var(--bg); font-size: 13px; padding-top: 7px; padding-bottom: 7px; }
tr.click:hover td { background: var(--accent-soft); }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.li .main .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.li .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }

.empty { padding: 24px 16px; text-align: center; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step b.n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }

.fab { position: fixed; right: max(16px, calc(50% - 534px)); bottom: 78px; z-index: 21; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--graphite); color: var(--amber); font-size: 30px; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.22); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; z-index: 50; display: none; white-space: nowrap; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.42); z-index: 40; display: none; }
.scrim.open { display: block; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 41; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: none; }
.sheet.open { display: block; }
.sheet .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.sheet .x { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; }
form.f { display: grid; gap: 12px; }
form.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
label.fl input, label.fl select, label.fl textarea { font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 15px; width: 100%; }
label.ck { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.err { color: var(--bad); font-size: 13px; }
pre.stmt { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); padding: 12px; border-radius: 8px; font-family: var(--font-mono); font-size: 12.5px; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 60; font-size: 14px; display: none; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.detail-grid > div > span:first-child { display: block; font-size: 12px; color: var(--muted); }
.detail-grid div b { font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { form.f .two { grid-template-columns: 1fr; } .kpi .value { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) { .sheet.open { animation: up .18s ease-out; } @keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } } }
</style>
</head>

<script>
"use strict";
/* ============ Constants ============ */
const TZ = "Africa/Nairobi";
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const EXPENSE_CATS = ["Service", "Repairs & parts", "Tyres", "Insurance", "Inspection & licences", "Tracker", "Platform fees", "Fines & penalties", "Accident damage", "Car wash & other"];
const DOWN_REASONS = [
  { v: "Service / repair", excused: true },
  { v: "Accident", excused: true },
  { v: "No driver assigned", excused: true },
  { v: "Platform suspension", excused: true },
  { v: "Driver absent", excused: false },
  { v: "Other", excused: true }
];
const METHODS = ["M-Pesa Till", "M-Pesa Paybill", "M-Pesa (personal)", "Cash", "Bank", "Deposit", "Refund"];
const adjTotal = d => (Array.isArray(d.adjustments) ? d.adjustments : []).reduce((t, a) => t + (Number(a.amount) || 0), 0);
const isLeft = id => { const r = driverById(id); return !!(r && r.status === "left"); };
const DEFAULT_SETTINGS = { name: "", trackStart: "", warnDays: 30, arrearsDays: 2, serviceWarnKm: 500, serviceIntervalKm: 5000 };

/* ============ Date & format helpers ============ */
const todayStr = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * 86400000);
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);
const weekday = s => new Date(toUTC(s)).getUTCDay();
const monthOf = s => s.slice(0, 7);
const monthStart = m => m + "-01";
const monthEnd = m => { const [y, mo] = m.split("-").map(Number); return fromUTC(Date.UTC(y, mo, 0)); };
const addMonths = (m, n) => { const [y, mo] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mo - 1 + n, 1)); return d.toISOString().slice(0, 7); };
function monthsBetween(a, b) { const out = []; let m = a; while (m <= b) { out.push(m); m = addMonths(m, 1); } return out; }
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtMonth = m => MONTHS_SHORT[Number(m.slice(5, 7)) - 1] + " " + m.slice(0, 4);
const fmtDate = s => s ? Number(s.slice(8, 10)) + " " + MONTHS_SHORT[Number(s.slice(5, 7)) - 1] + " " + s.slice(0, 4) : "—";
const fmtShort = s => s ? Number(s.slice(8, 10)) + " " + MONTHS_SHORT[Number(s.slice(5, 7)) - 1] : "—";
const ksh = n => (n < 0 ? "−" : "") + "KSh " + Math.round(Math.abs(n || 0)).toLocaleString("en-KE");
const kshShort = n => { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M" : a >= 1e3 ? Math.round(a / 1e3) + "k" : Math.round(a) + ""; return (n < 0 ? "−" : "") + s; };
const pct = x => isFinite(x) ? Math.round(x * 100) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const normPlate = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const digits = s => String(s || "").replace(/\D/g, "");
const phoneKey = s => { const d = digits(s); return d.length >= 9 ? d.slice(-9) : ""; };
const num = v => { const n = Number(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };

/* ============ State ============ */
const S = {
  db: null, user: null, canWrite: true,
  cars: [], drivers: [], assigns: [], settings: { ...DEFAULT_SETTINGS },
  months: {},          // "YYYY-MM" -> {payments:[], expenses:[], downtime:[], odo:[]}
  loadedMonths: new Set(), subs: [], coreReady: { cars: false, drivers: false, assigns: false, settings: false },
  period: "month", view: "home", detail: null, calc: null,
  mode: "family", confirmed: new Set(), pending: [], summaries: {}, me: null, dsum: null, mySubs: []
};
const META = { includeMetadataChanges: true };
function confirmKey(key, snap) { if (!snap.metadata.fromCache) S.confirmed.add(key); }
function allConfirmed() {
  if (!["cars", "drivers", "assignments", "settings", "driverSummaries"].every(k => S.confirmed.has(k))) return false;
  for (const m of S.loadedMonths) for (const k of KINDS) if (!S.confirmed.has(`months/${m}/${k}`)) return false;
  return true;
}
const KINDS = ["payments", "expenses", "downtime", "odo"];
const all = kind => Object.values(S.months).flatMap(m => m[kind] || []);
const carById = id => S.cars.find(c => c.id === id);
const driverById = id => S.drivers.find(d => d.id === id);
const carLabel = id => { const c = carById(id); return c ? c.plate : "Unknown car"; };
const driverName = id => { const d = driverById(id); return d ? d.name : "Unknown driver"; };
function trackStart() { return S.settings.trackStart || monthStart(monthOf(todayStr())); }

function assignOn(carId, date) {
  return S.assigns.find(a => a.carId === carId && a.start <= date && (!a.end || a.end >= date));
}
function driverAssignOn(driverId, date) {
  return S.assigns.find(a => a.driverId === driverId && a.start <= date && (!a.end || a.end >= date));
}
// Which car a payment belongs to: the car the driver had that day, else their most recent car before it
function payAssign(p) {
  return driverAssignOn(p.driverId, p.date) || S.assigns.filter(x => x.driverId === p.driverId && x.start <= p.date).sort((x, y) => y.start.localeCompare(x.start))[0] || null;
}
function payCar(p) { const a = payAssign(p); return a ? a.carId : p.carId || ""; }
function currentAssignForDriver(id) { return driverAssignOn(id, todayStr()); }
function currentAssignForCar(id) { return assignOn(id, todayStr()); }

/* ============ Calculation engine ============ */
function periodRange(p) {
  const T = todayStr(), m = monthOf(T), ts = trackStart();
  if (p === "month") return { from: monthStart(m), to: T, label: fmtMonth(m) + " to date" };
  if (p === "last") { const lm = addMonths(m, -1); return { from: monthStart(lm), to: monthEnd(lm), label: fmtMonth(lm) }; }
  if (p === "ytd") return { from: T.slice(0, 4) + "-01-01", to: T, label: "Year to date" };
  return { from: ts, to: T, label: "Since " + fmtDate(ts) };
}

function compute() {
  const T = todayStr(), TS = trackStart();
  const P = periodRange(S.period);
  const from = P.from < TS ? TS : P.from, to = P.to;
  const inP = d => d >= from && d <= to;

  // downtime map: carId -> Map(date -> {excused, reason})
  const down = {};
  for (const x of all("downtime")) {
    if (!x.carId || !x.from) continue;
    const end = x.to && x.to < T ? x.to : (x.to || T) > T ? T : (x.to || T);
    const m = down[x.carId] || (down[x.carId] = new Map());
    for (let d = x.from; d <= end; d = addDays(d, 1)) {
      const prev = m.get(d);
      // an unexcused entry wins only if no excused entry covers the day
      if (!prev || (!prev.excused && x.excused !== false)) m.set(d, { excused: x.excused !== false, reason: x.reason });
    }
  }

  const ds = {}, cs = {}, fleetM = {};
  const dInit = id => ds[id] || (ds[id] = { expAll: 0, expP: 0, payAll: 0, payP: 0, chgAll: 0, chgP: 0, lastPay: null });
  const cInit = id => cs[id] || (cs[id] = { expP: 0, revP: 0, revAll: 0, costP: 0, costAll: 0, earnP: 0, denomP: 0, downP: 0, idleP: 0, kmP: 0, revM: {}, costM: {} });
  const fInit = m => fleetM[m] || (fleetM[m] = { rev: 0, cost: 0, exp: 0 });
  S.drivers.forEach(d => dInit(d.id));
  S.cars.forEach(c => cInit(c.id));

  // Per-assignment day counts and each driver's charged days (for "days paid")
  const aStats = {}, chargedDays = {};
  const aInit = a => aStats[a.id] || (aStats[a.id] = { id: a.id, carId: a.carId, driverId: a.driverId, rate: Number(a.rate) || 0, start: a.start, end: a.end, days: 0, rest: 0, off: 0, absent: 0, worked: 0, charged: 0, due: 0, first: null, last: null });
  const pp = {}; // assignment id -> stats inside the selected period
  const ppInit = a => pp[a.id] || (pp[a.id] = { exp: 0, earn: 0, denom: 0, down: 0, charged: 0, paid: 0, cost: 0 });
  // Day loop per car
  for (const c of S.cars) {
    const st = c.inServiceDate && c.inServiceDate > TS ? c.inServiceDate : TS;
    const en = c.soldDate && c.soldDate < T ? c.soldDate : T;
    const cst = cs[c.id], dm = down[c.id];
    for (let d = st; d <= en; d = addDays(d, 1)) {
      const a = assignOn(c.id, d);
      const ast = a ? aInit(a) : null;
      if (ast) { ast.days++; if (!ast.first || d < ast.first) ast.first = d; if (!ast.last || d > ast.last) ast.last = d; }
      if (a && a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(d)) { ast.rest++; continue; }
      const dn = dm && dm.get(d);
      const p = inP(d);
      if (p) { cst.denomP++; if (dn) cst.downP++; else if (!a) cst.idleP++; }
      if (a) {
        const rate = Number(a.rate) || 0;
        if (dn && dn.excused) ast.off++;
        else { ast.charged++; ast.due += rate; if (dn) ast.absent++; else ast.worked++; (chargedDays[a.driverId] || (chargedDays[a.driverId] = [])).push({ d, rate }); }
        if (!(dn && dn.excused)) {
          const dst = dInit(a.driverId);
          dst.expAll += rate;
          fInit(monthOf(d)).exp += rate;
          if (p) { dst.expP += rate; cst.expP += rate; }
        }
        if (!dn && p) cst.earnP++;
        if (p) { const k = ppInit(a); k.denom++; if (!dn) k.earn++; else k.down++; if (!(dn && dn.excused)) { k.exp += rate; k.charged++; } }
      }
    }
  }
  for (const x of all("payments")) {
    if (x.date < TS) continue;
    const amt = Number(x.amount) || 0, dst = dInit(x.driverId);
    dst.payAll += amt;
    if (!dst.lastPay || x.date > dst.lastPay) dst.lastPay = x.date;
    if (inP(x.date)) dst.payP += amt;
    fInit(monthOf(x.date)).rev += amt;
    const pc = payCar(x);
    if (pc) { const c = cInit(pc); c.revAll += amt; c.revM[monthOf(x.date)] = (c.revM[monthOf(x.date)] || 0) + amt; if (inP(x.date)) c.revP += amt; }
  }
  for (const x of all("expenses")) {
    if (x.date < TS) continue;
    const amt = Number(x.amount) || 0;
    fInit(monthOf(x.date)).cost += amt;
    if (x.carId) { const c = cInit(x.carId); c.costAll += amt; c.costM[monthOf(x.date)] = (c.costM[monthOf(x.date)] || 0) + amt; if (inP(x.date)) c.costP += amt; }
    if (x.chargeDriver && x.driverId) { const dst = dInit(x.driverId); dst.chgAll += amt; if (inP(x.date)) dst.chgP += amt; }
    // Driver paid from their own money: still an owner cost, but it counts as a payment from the driver
    if (x.paidByDriver && x.driverId) {
      const dst = dInit(x.driverId); dst.payAll += amt; dst.creditAll = (dst.creditAll || 0) + amt; if (inP(x.date)) dst.payP += amt;
      fInit(monthOf(x.date)).rev += amt;
      if (x.carId) { const c = cInit(x.carId); c.revAll += amt; c.revM[monthOf(x.date)] = (c.revM[monthOf(x.date)] || 0) + amt; if (inP(x.date)) c.revP += amt; }
    }
  }
  // Odometer
  const odoBy = {};
  for (const x of all("odo")) (odoBy[x.carId] || (odoBy[x.carId] = [])).push({ date: x.date, km: Number(x.km) || 0 });
  for (const x of all("expenses")) if (x.odometer && x.carId) (odoBy[x.carId] || (odoBy[x.carId] = [])).push({ date: x.date, km: Number(x.odometer) || 0 });
  const odoInfo = {};
  for (const c of S.cars) {
    const r = (odoBy[c.id] || []).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.km - b.km);
    const last = r[r.length - 1];
    const before = r.filter(x => x.date < from).pop();
    const inside = r.filter(x => inP(x.date));
    let kmP = 0;
    if (inside.length) { const base = before ? before.km : inside[0].km; kmP = Math.max(0, inside[inside.length - 1].km - base); }
    cs[c.id].kmP = kmP;
    const svc = all("expenses").filter(x => x.carId === c.id && x.category === "Service" && x.odometer).map(x => Number(x.odometer));
    const lastService = Math.max(Number(c.lastServiceKm) || 0, ...svc, 0);
    odoInfo[c.id] = { lastKm: last ? last.km : null, lastDate: last ? last.date : null, lastService };
  }

  // Driver balances
  const drivers = S.drivers.map(d => {
    const s = ds[d.id], a = currentAssignForDriver(d.id);
    const balance = (Number(d.openingBalance) || 0) + s.expAll + s.chgAll - s.payAll - adjTotal(d);
    const rate = a ? Number(a.rate) || 0 : 0;
    const lastA = a || S.assigns.filter(x => x.driverId === d.id).sort((x, y) => y.start.localeCompare(x.start))[0];
    const refRate = lastA ? Number(lastA.rate) || 0 : 0;
    const daysBehind = refRate ? balance / refRate : 0;
    let status = "good", statusLabel = "Up to date";
    if (balance < -1) { status = "good"; statusLabel = "In credit"; }
    else if (balance > 1) { if (daysBehind > Number(S.settings.arrearsDays || 2)) { status = "bad"; statusLabel = "In arrears"; } else { status = "warn"; statusLabel = "Slightly behind"; } }
    if (d.status === "left" && Math.abs(balance) <= 1) { status = "neutral"; statusLabel = "Settled"; }
    // Days: payments cover the opening balance and charges first, then daily rates oldest first
    const asg = Object.values(aStats).filter(x => x.driverId === d.id).sort((x, y) => x.start.localeCompare(y.start));
    const tot = asg.reduce((t, x) => { for (const k of ["days", "rest", "off", "absent", "worked", "charged", "due"]) t[k] += x[k]; return t; }, { days: 0, rest: 0, off: 0, absent: 0, worked: 0, charged: 0, due: 0 });
    const cd = (chargedDays[d.id] || []).sort((x, y) => x.d.localeCompare(y.d));
    let pool = s.payAll + adjTotal(d) - (Number(d.openingBalance) || 0) - s.chgAll, paidDays = 0, paidUpTo = null, partial = 0;
    for (const x of cd) { if (pool >= x.rate - 0.5) { pool -= x.rate; paidDays++; paidUpTo = x.d; } else { partial = Math.max(0, pool); pool = 0; break; } }
    const aheadDays = pool > 0.5 && refRate ? pool / refRate : 0;
    const days = { asg, ...tot, paidDays, unpaidDays: tot.charged - paidDays, paidUpTo, partial, aheadDays, first: asg.length ? asg.map(x => x.first).filter(Boolean).sort()[0] || null : null, last: asg.length ? asg.map(x => x.last).filter(Boolean).sort().pop() || null : null };
    return { ...d, ...s, balance, rate, daysBehind, assign: a, status, statusLabel, days, collRateP: s.expP + s.chgP ? s.payP / (s.expP + s.chgP) : NaN };
  });

  // Car rows
  const cars = S.cars.map(c => {
    const s = cs[c.id], a = currentAssignForCar(c.id), o = odoInfo[c.id];
    const net = s.revP - s.costP, netAll = s.revAll - s.costAll;
    const price = Number(c.purchasePrice) || 0;
    const recentMs = [1, 2, 3].map(i => addMonths(monthOf(T), -i));
    const avgNet = recentMs.reduce((t, m) => t + (s.revM[m] || 0) - (s.costM[m] || 0), 0) / 3;
    const remain = price - netAll;
    const today = down[c.id] && down[c.id].get(T);
    let status = "good", statusLabel = "On the road";
    if (c.soldDate && c.soldDate <= T) { status = "neutral"; statusLabel = "Sold"; }
    else if (today) { status = "bad"; statusLabel = "Off road · " + today.reason; }
    else if (!a) { status = "warn"; statusLabel = "No driver"; }
    else if (a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(T)) { status = "neutral"; statusLabel = "Rest day"; }
    return {
      ...c, ...s, assign: a, driver: a ? driverById(a.driverId) : null, net, netAll, price,
      util: s.denomP ? s.earnP / s.denomP : NaN, collRate: s.expP ? s.revP / s.expP : NaN,
      payback: price ? netAll / price : NaN, monthsLeft: price && remain > 0 && avgNet > 0 ? remain / avgNet : (price && remain <= 0 ? 0 : NaN),
      costPerKm: s.kmP ? s.costP / s.kmP : NaN, odo: o, status, statusLabel, downToday: today,
      periodDrivers: S.assigns.filter(x => x.carId === c.id && x.start <= to && (!x.end || x.end >= from)).sort((x, y) => x.start.localeCompare(y.start))
        .map(x => {
          const ps = x.start < from ? from : x.start, pe = !x.end || x.end > to ? to : x.end, k = pp[x.id] || { exp: 0, earn: 0, denom: 0, down: 0, charged: 0 };
          const paid = all("payments").filter(p => inP(p.date) && p.date >= TS && (payAssign(p) || {}).id === x.id).reduce((t, p) => t + (Number(p.amount) || 0), 0);
          const cost = all("expenses").filter(e => e.carId === c.id && e.date >= ps && e.date <= pe && e.date >= TS).reduce((t, e) => t + (Number(e.amount) || 0), 0);
          return { aid: x.id, id: x.driverId, name: driverName(x.driverId), s: ps, e: pe, full: x.start <= from && (!x.end || x.end >= to), rate: Number(x.rate) || 0,
            due: k.exp, paid, cost, net: paid - cost, worked: k.earn, charged: k.charged, util: k.denom ? k.earn / k.denom : NaN, coll: k.exp ? paid / k.exp : NaN };
        })
    };
  });

  // Today
  const todayRows = [];
  for (const a of S.assigns.filter(a => a.start <= T && (!a.end || a.end >= T))) {
    const car = carById(a.carId); if (!car) continue;
    const isRest = a.restDay !== "" && a.restDay != null && Number(a.restDay) === weekday(T);
    const dn = down[a.carId] && down[a.carId].get(T);
    const due = isRest || (dn && dn.excused) ? 0 : Number(a.rate) || 0;
    const paid = all("payments").filter(p => p.driverId === a.driverId && p.date === T).reduce((t, p) => t + (Number(p.amount) || 0), 0);
    todayRows.push({ a, car, driver: driverById(a.driverId), due, paid, isRest, dn });
  }

  // Fleet totals for period
  const tot = cars.reduce((t, c) => { t.rev += c.revP; t.cost += c.costP; t.exp += c.expP; t.earn += c.earnP; t.denom += c.denomP; return t; }, { rev: 0, cost: 0, exp: 0, earn: 0, denom: 0 });
  // payments with no car still count as revenue
  const unassignedRev = all("payments").filter(p => !payCar(p) && inP(p.date) && p.date >= TS).reduce((t, p) => t + (Number(p.amount) || 0), 0);
  tot.rev += unassignedRev;
  tot.net = tot.rev - tot.cost;
  tot.arrears = drivers.filter(d => d.balance > 0).reduce((t, d) => t + d.balance, 0);
  tot.charges = drivers.reduce((t, d) => t + d.chgP, 0);

  // Alerts
  const alerts = [];
  const W = Number(S.settings.warnDays) || 30;
  const docCheck = (date, what, who, link) => {
    if (!date) return;
    const left = dayDiff(T, date);
    if (left < 0) alerts.push({ sev: "bad", what: `${what} expired`, why: `${who} · expired ${fmtDate(date)}`, link, sort: left });
    else if (left <= W) alerts.push({ sev: left <= 7 ? "bad" : "warn", what: `${what} due in ${left} day${left === 1 ? "" : "s"}`, why: `${who} · ${fmtDate(date)}`, link, sort: left });
  };
  for (const c of cars) {
    if (c.soldDate && c.soldDate <= T) continue;
    docCheck(c.insuranceExpiry, "Insurance", c.plate, "car:" + c.id);
    docCheck(c.inspectionExpiry, "NTSA inspection", c.plate, "car:" + c.id);
    docCheck(c.tncExpiry, "PSV / platform licence", c.plate, "car:" + c.id);
    docCheck(c.trackerExpiry, "Tracker subscription", c.plate, "car:" + c.id);
    const iv = Number(c.serviceIntervalKm) || Number(S.settings.serviceIntervalKm) || 5000;
    if (c.odo.lastKm != null && c.odo.lastService) {
      const since = c.odo.lastKm - c.odo.lastService, left = iv - since;
      if (left <= (Number(S.settings.serviceWarnKm) || 500)) alerts.push({ sev: left < 0 ? "bad" : "warn", what: left < 0 ? `Service overdue by ${Math.abs(left).toLocaleString()} km` : `Service due in ${left.toLocaleString()} km`, why: `${c.plate} · ${c.odo.lastKm.toLocaleString()} km now, last service at ${c.odo.lastService.toLocaleString()} km`, link: "car:" + c.id, sort: left / 100 });
    }
    if (c.assign && (!c.odo.lastDate || dayDiff(c.odo.lastDate, T) > 8)) alerts.push({ sev: "warn", what: "Mileage not recorded this week", why: `${c.plate} · last reading ${c.odo.lastDate ? fmtDate(c.odo.lastDate) : "never"}`, link: "car:" + c.id, sort: 50 });
    if (!c.assign && !c.downToday) alerts.push({ sev: "warn", what: "Car has no driver", why: `${c.plate} is earning nothing`, link: "car:" + c.id, sort: 5 });
  }
  for (const d of drivers) {
    if (!d.assign && !isLeft(d.id) && Math.abs(d.balance) > 1 && S.assigns.some(a => a.driverId === d.id)) alerts.push({ sev: "warn", what: `${d.name} isn't driving: settle the balance`, why: d.balance > 0 ? `Still owes ${ksh(d.balance)}` : `Shows ${ksh(-d.balance)} in credit`, link: "driver:" + d.id, sort: 20 });
    if (d.status === "bad") alerts.push({ sev: "bad", what: `${d.name} owes ${ksh(d.balance)}`, why: `About ${d.daysBehind.toFixed(1)} days of payments behind`, link: "driver:" + d.id, sort: -d.daysBehind });
    docCheck(d.licenseExpiry, "Driving licence", d.name, "driver:" + d.id);
    docCheck(d.psvBadgeExpiry, "PSV badge", d.name, "driver:" + d.id);
  }
  if (S.pending.length) alerts.push({ sev: "warn", what: `${S.pending.length} driver update${S.pending.length === 1 ? "" : "s"} to review`, why: "Payments, mileage or problems reported by drivers", link: "go:collect", sort: -1000 });
  alerts.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === "bad" ? -1 : 1) || a.sort - b.sort);

  // Trend: last 6 months
  const curM = monthOf(T);
  const trend = monthsBetween(addMonths(curM, -5), curM).filter(m => m >= monthOf(TS)).map(m => ({ m, ...(fleetM[m] || { rev: 0, cost: 0, exp: 0 }) }));

  return { T, P: { ...P, from }, drivers, cars, todayRows, tot, alerts, trend, down };
}

/* ============ Data layer ============ */
function monthBucket(m) { return S.months[m] || (S.months[m] = { payments: [], expenses: [], downtime: [], odo: [] }); }
const snapRows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

async function boot() {
  document.getElementById("today-label").textContent = fmtDate(todayStr());
  if (!window.firebase || FIREBASE_CONFIG.apiKey.startsWith("PASTE")) {
    setSync("Not set up");
    document.getElementById("view").innerHTML = `<div class="card"><h2>Almost there</h2><p class="muted">Paste your Firebase config into index.html (search for FIREBASE_CONFIG). The README explains each step.</p></div>`;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) {}
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {} // works offline on patchy networks
  firebase.auth().onAuthStateChanged(async u => {
    if (!u) { setSync("Signed out"); document.getElementById("signout").style.display = "none"; document.getElementById("fab").style.display = "none"; viewLogin(); return; }
    document.getElementById("signout").style.display = "";
    S.user = u;
    setSync("Checking access…");
    let link = null;
    try { const snap = await fs.collection("driverLogins").doc(String(u.email || "").toLowerCase()).get(); if (snap.exists) link = snap.data(); } catch (e) {}
    if (link && link.driverId) startDriver(fs, link.driverId); else startData(fs);
  });
}

function viewLogin(msg) {
  document.querySelector("nav.tabs").style.display = "none";
  document.getElementById("view").innerHTML = `<div class="login-hero">
    <h1 class="hero-title"><span class="two-tone">Every car.</span><br>Every shilling.<br><span class="two-tone">Any moment.</span></h1>
    <p class="muted" style="margin:10px 0 0;max-width:34ch">Daily payments, driver balances and car profit for your ride-hailing fleet.</p></div>
  <div class="card" style="max-width:440px;margin:18px auto 24px">
    <h2 style="margin-bottom:6px">Sign in</h2><p class="small muted" style="margin-top:0">Use the email and password the fleet owner set up for you.</p>
    <form class="f" id="login-form" novalidate>
      <label class="fl" for="login-email">Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label class="fl" for="login-pass">Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="login-err">${esc(msg || "")}</div>
      <div class="row-actions"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" data-action="reset-pass">Forgot password</button></div>
    </form></div>`;
}

function authMsg(e) {
  const c = e && e.code || "";
  if (/wrong-password|invalid-credential|user-not-found|invalid-email/.test(c)) return "Email or password is wrong.";
  if (/too-many-requests/.test(c)) return "Too many tries. Wait a few minutes and try again.";
  if (/network/.test(c)) return "No internet connection.";
  return "Couldn't sign in (" + c + ").";
}

function startData(db) {
  if (S.db) return;
  document.querySelector("nav.tabs").style.display = "";
  S.db = db;
  const timer = setTimeout(() => setSync("Can't reach the data yet. Check your connection."), 10000);
  const onErr = e => {
    clearTimeout(timer);
    if (e && e.code === "permission-denied") {
      document.getElementById("view").innerHTML = `<div class="card"><h2>No access yet</h2><p class="muted">${esc(S.user.email)} isn't on the family list. Ask the fleet owner to add your email to the Firestore rules.</p></div>`;
      setSync("No access");
    } else setSync("Data unavailable: " + (e && e.code || "error"));
  };
  const synced = snap => setSync(snap.metadata.fromCache ? "Saved copy (offline)" : "Up to date");
  const core = (name, coll, key) => S.subs.push(db.collection(coll).onSnapshot(META, snap => {
    clearTimeout(timer);
    confirmKey(coll, snap);
    S[key] = snapRows(snap);
    S.coreReady[name] = true;
    synced(snap);
    afterCore();
  }, onErr));
  core("cars", "cars", "cars");
  core("drivers", "drivers", "drivers");
  core("assigns", "assignments", "assigns");
  S.subs.push(db.doc("settings/main").onSnapshot(META, snap => {
    confirmKey("settings", snap);
    S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    S.coreReady.settings = true;
    document.getElementById("biz-name").textContent = S.settings.name || ""; document.getElementById("biz-sep").style.display = S.settings.name ? "" : "none";
    afterCore();
  }, onErr));
  S.subs.push(db.collection("submissions").where("status", "==", "pending").onSnapshot(snap => { S.pending = snapRows(snap); render(); }, () => {}));
  S.subs.push(db.collection("driverSummaries").onSnapshot(META, snap => { confirmKey("driverSummaries", snap); S.summaries = {}; snap.docs.forEach(d => { S.summaries[d.id] = d.data(); }); render(); }, () => {}));
}

function afterCore() {
  if (!Object.values(S.coreReady).every(Boolean)) return;
  const T = todayStr();
  const months = monthsBetween(monthOf(trackStart()), monthOf(T));
  const live = new Set(months.slice(-12));
  for (const m of months) {
    if (S.loadedMonths.has(m)) continue;
    S.loadedMonths.add(m);
    monthBucket(m);
    for (const k of KINDS) {
      const col = S.db.collection(`months/${m}/${k}`);
      const key = `months/${m}/${k}`;
      if (live.has(m)) S.subs.push(col.onSnapshot(META, snap => { confirmKey(key, snap); monthBucket(m)[k] = snapRows(snap); render(); }, e => setSync("Data unavailable: " + e.code)));
      else col.get().then(snap => { confirmKey(key, snap); monthBucket(m)[k] = snapRows(snap); render(); }).catch(() => {});
    }
  }
  render();
}

async function refreshMonth(m, kind) {
  if (!S.loadedMonths.has(m)) { afterCore(); return; }
  try { const snap = await S.db.collection(`months/${m}/${kind}`).get(); monthBucket(m)[kind] = snapRows(snap); render(); } catch (e) {}
}

function setSync(t) { document.getElementById("sync").textContent = t; }

async function save(fn, okMsg) {
  if (!S.canWrite) { toast("You have view-only access"); return false; }
  try {
    // Firestore saves to the phone first and syncs later; don't wait forever on a weak network
    const r = await Promise.race([fn().then(() => "ok"), new Promise(res => setTimeout(() => res("queued"), 5000))]);
    toast(r === "queued" ? "Saved on this phone. It will sync when the network is back." : okMsg || "Saved");
    return true;
  }
  catch (e) {
    const c = e && e.code;
    if (c === "permission-denied") { toast("Not saved: your account isn't allowed to change data"); }
    else if (c === "resource-exhausted") toast("Not saved: the free daily limit was reached. Try again tomorrow.");
    else toast("Not saved, please try again (" + (c || "error") + ")");
    return false;
  }
}

function recordId(ref) { const r = String(ref || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); return r.length >= 6 ? r : null; }
async function writeRecord(kind, data, oldRec) {
  const m = monthOf(data.date || data.from);
  const id = oldRec ? oldRec.id : (kind === "payments" && recordId(data.ref)) || undefined;
  const oldM = oldRec ? monthOf(oldRec.date || oldRec.from) : null;
  const col = S.db.collection(`months/${m}/${kind}`);
  await (id ? col.doc(id) : col.doc()).set({ ...data, updatedAt: new Date().toISOString() });
  if (oldRec && oldM !== m) await S.db.collection(`months/${oldM}/${kind}`).doc(oldRec.id).delete();
  refreshMonth(m, kind); if (oldM && oldM !== m) refreshMonth(oldM, kind);
}
async function deleteRecord(kind, rec) {
  const m = monthOf(rec.date || rec.from);
  await S.db.collection(`months/${m}/${kind}`).doc(rec.id).delete();
  refreshMonth(m, kind);
}

/* ============ Rendering ============ */
function render() {
  if (S.mode === "driver") { renderDriver(); return; }
  if (!S.db || !Object.values(S.coreReady).every(Boolean)) return;
  S.calc = compute();
  const v = document.getElementById("view");
  const map = { home: viewHome, collect: viewCollect, cars: viewCars, drivers: viewDrivers, more: viewMore, import: viewImport, settings: viewSettings };
  const fn = map[S.view] || viewHome;
  const scrollY = window.scrollY;
  v.innerHTML = fn(S.calc);
  window.scrollTo(0, scrollY);
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === S.view || (S.view === "import" || S.view === "settings") && a.dataset.tab === "more"));
  document.getElementById("banner").innerHTML = S.canWrite ? "" : `<div class="banner">You can view this ledger but not change it. Ask the owner to share it with you as an Editor.</div>`;
  document.getElementById("fab").style.display = S.canWrite && S.cars.length ? "" : "none";
  bindChart();
  syncSummaries();
}

function trendChart(tr) {
  if (!tr.length) return "";
  const W = Math.max(340, Math.min(640, (document.getElementById("view").clientWidth || 640) - 30)), H = 220, L = 46, R = 8, Tp = 12, B = 26;
  const max = Math.max(1, ...tr.map(x => Math.max(x.rev, x.cost)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
  const y = v => Tp + (H - Tp - B) * (1 - v / nice);
  const gw = (W - L - R) / tr.length, bw = Math.min(26, gw / 3.2);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * nice);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly collections and owner costs">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${kshShort(t)}</text>`;
  tr.forEach((m, i) => {
    const cx = L + gw * i + gw / 2;
    const bar = (v, x, col, name) => { const top = y(v), h = Math.max(0, H - B - top); return h > 0 ? `<path d="M${x},${H - B} V${top + Math.min(4, h)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - B} Z" fill="${col}" data-tip="${esc(fmtMonth(m.m))} · ${name}: ${esc(ksh(v))}"/>` : ""; };
    s += bar(m.rev, cx - bw - 1, "var(--series-1)", "Collected") + bar(m.cost, cx + 1, "var(--series-2)", "Owner costs");
    s += `<rect x="${cx - gw / 2}" y="${Tp}" width="${gw}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(fmtMonth(m.m))} · Collected ${esc(ksh(m.rev))} · Costs ${esc(ksh(m.cost))} · Net ${esc(ksh(m.rev - m.cost))}"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MONTHS_SHORT[Number(m.m.slice(5)) - 1]}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="section"><div class="section-head"><h2>Monthly trend</h2><div class="legend"><span><i style="background:var(--series-1)"></i>Collected</span><span><i style="background:var(--series-2)"></i>Owner costs</span></div></div><div class="card">${s}</div></div>`;
}

function bindChart() {
  const tip = document.getElementById("tip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("pointermove", e => { tip.textContent = el.getAttribute("data-tip"); tip.style.display = "block"; const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY - 34) + "px"; });
    el.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  });
}

function carTable(cars) {

    <td></td>
    <td><span class="small">↳</span> ${esc(p.name)}<div class="small muted">${fmtShort(p.s)} – ${p.e === T ? "now" : fmtShort(p.e)} · ${p.worked} days worked</div></td>
    <td class="r">${ksh(p.paid)}<div class="small muted">${pct(p.coll)} of ${ksh(p.due)}</div></td>

  </tr>`).join("") : "";
  const rows = [...cars].sort((a, b) => b.net - a.net).map(c => `<tr class="click" data-action="open" data-v="car:${c.id}">

    <td class="r">${ksh(c.revP)}<div class="small muted">${pct(c.collRate)} of due</div></td>

    <td class="r">${isFinite(c.payback) ? pct(c.payback) : "—"}<div class="small muted">${isFinite(c.monthsLeft) ? (c.monthsLeft === 0 ? "Paid back" : "~" + Math.ceil(c.monthsLeft) + " mo left") : ""}</div></td>
  </tr>${sub(c)}`).join("");
  return `<div class="table-wrap"><table><thead><tr><th>Car</th><th>Drivers</th><th class="r">Collected</th><th class="r">Costs</th><th class="r">Net</th><th class="r">Utilisation</th><th class="r">Cost/km</th><th class="r">Paid back</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function periodDriversHtml(c) {

function carDetail(c, id) {
  const car = c.cars.find(x => x.id === id); if (!car) { S.detail = null; return viewCars(c); }

  return `<div class="section"><div class="row-actions"><button class="btn sm" data-action="back">← All cars</button></div>
  <div class="section-head"><h2>${plate(car.plate)} ${esc([car.make, car.model, car.year].filter(Boolean).join(" "))}</h2>${pill(car.status, car.statusLabel)}</div>
  <div class="row-actions">${S.canWrite ? `<button class="btn sm" data-action="edit-car" data-v="${id}">Edit car</button><button class="btn sm" data-action="new-assign" data-v="car:${id}">${car.assign ? "Change driver" : "Assign driver"}</button><button class="btn sm" data-action="new-expense" data-v="${id}">Add expense</button><button class="btn sm" data-action="new-downtime" data-v="${id}">Log off-road days</button><button class="btn sm" data-action="new-odo" data-v="${id}">Record mileage</button>` : ""}</div>

/* ============ M-Pesa import ============ */
let IMP = null;
function viewImport() {
  const body = !IMP ? `<div class="card"><h3>Upload an M-Pesa statement</h3>
    <p class="small muted">From the M-Pesa Org Portal (or M-Pesa for Business app), export the Till or Paybill statement as Excel or CSV. The importer reads the <b>Receipt No.</b>, <b>Completion Time</b>, <b>Paid In</b>, <b>Other Party Info</b> and <b>A/C No.</b> columns, then matches each payment to a driver by phone number, name, or the car plate used as account number. Receipts already recorded are skipped.</p>
    <label class="fl" for="imp-file">Statement file (.xlsx, .xls or .csv)<input id="imp-file" type="file" accept=".xlsx,.xls,.csv"></label>

    : importPreview();
  return `<div class="section"><div class="row-actions"><button class="btn sm" data-action="imp-reset">← Back</button></div><h2>Import M-Pesa payments</h2>${body}</div>`;

function parseAnyDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}` : null; }
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  const t = Date.parse(s); return isNaN(t) ? null : new Date(t).toISOString().slice(0, 10);
}

function matchDriver(row) {
  const T = row.date || todayStr();
  const hay = (row.party + " " + row.details + " " + row.account).toUpperCase();
  const acct = normPlate(row.account + " " + row.details);
  // 1. Plate in account number
  for (const c of S.cars) { const p = normPlate(c.plate); if (p.length >= 5 && acct.includes(p)) { const a = assignOn(c.id, T); if (a) return { driverId: a.driverId, how: "plate" }; } }
  // 2. Full phone number
  const ph = phoneKey(row.party) || phoneKey(row.details);
  if (ph) { const d = S.drivers.find(d => phoneKey(d.phone) === ph); if (d) return { driverId: d.id, how: "phone" }; }
  // 3. Name: all name parts found, or first + last
  let best = null;
  for (const d of S.drivers) {
    const parts = String(d.name || "").toUpperCase().split(/\s+/).filter(x => x.length > 1);
    const hits = parts.filter(p => new RegExp("\\b" + p.replace(/[^A-Z]/g, "") + "\\b").test(hay)).length;
    if (parts.length && hits >= Math.min(2, parts.length) && (!best || hits > best.hits)) best = { driverId: d.id, how: "name", hits };
  }
  return best || { driverId: "", how: "" };
}

async function handleImportFile(file) {
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    let rows = [];
    for (const name of wb.SheetNames) rows = rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" }));
    const hi = rows.findIndex(r => r.some(c => /receipt/i.test(String(c))) && r.some(c => /paid\s*in|amount|credit/i.test(String(c))));
    if (hi < 0) { toast("Couldn't find the Receipt No. and Paid In columns in this file"); return; }
    const H = rows[hi].map(c => String(c).trim().toLowerCase());
    const col = re => H.findIndex(h => re.test(h));
    const ci = { rec: col(/receipt/), time: col(/completion|date|time/), det: col(/details|description/), paid: col(/paid\s*in|credit|amount/), party: col(/other party|party|sender|name/), acct: col(/a\/c|account|bill ref/), status: col(/status/) };
    const known = new Set(all("payments").map(p => p.id));
    const out = [];
    for (const r of rows.slice(hi + 1)) {
      const rec = String(r[ci.rec] ?? "").trim(); const amt = num(r[ci.paid]);
      if (!rec || amt <= 0) continue;
      if (ci.status >= 0 && r[ci.status] && !/complet/i.test(String(r[ci.status]))) continue;
      const row = { ref: rec, id: recordId(rec), date: parseAnyDate(r[ci.time]), amount: amt, details: ci.det >= 0 ? String(r[ci.det]) : "", party: ci.party >= 0 ? String(r[ci.party]) : "", account: ci.acct >= 0 ? String(r[ci.acct]) : "" };
      const m = matchDriver(row);
      row.driverId = m.driverId; row.how = m.how; row.dup = row.id && known.has(row.id);
      row.include = !row.dup && !!row.driverId && !!row.date && row.date >= trackStart();
      out.push(row);
    }
    IMP = { rows: out, file: file.name };
    render();
  } catch (e) { toast("Couldn't read that file. Try saving it as .xlsx or .csv"); }
}

function importPreview() {
  const r = IMP.rows; const sel = r.filter(x => x.include);
  const opts = id => `<option value="">Not a driver payment</option>` + S.drivers.map(d => `<option value="${d.id}" ${d.id === id ? "selected" : ""}>${esc(d.name)}</option>`).join("");
  return `<div class="card small">${esc(IMP.file)}: ${r.length} incoming payments found · ${r.filter(x => x.dup).length} already recorded · ${r.filter(x => !x.dup && x.driverId).length} matched to a driver. Check the matches, fix any that are wrong, then import.</div>
  <div class="table-wrap"><table><thead><tr><th></th><th>Date</th><th>Receipt</th><th class="r">Amount</th><th>From</th><th>Driver</th></tr></thead><tbody>
  ${r.map((x, i) => `<tr><td><input type="checkbox" id="imp-${i}" data-action="imp-toggle" data-v="${i}" ${x.include ? "checked" : ""} ${x.dup || !x.date ? "disabled" : ""} aria-label="Include ${esc(x.ref)}"></td><td>${x.date ? fmtShort(x.date) : `<span class="err">No date</span>`}</td><td class="small">${esc(x.ref)}${x.dup ? `<div>${pill("neutral", "Already recorded")}</div>` : ""}</td><td class="r">${ksh(x.amount)}</td><td class="small">${esc(x.party || x.details).slice(0, 60)}${x.account ? `<div class="muted">A/C ${esc(x.account)}</div>` : ""}</td>
  <td><select id="imp-d-${i}" data-action="imp-driver" data-v="${i}" ${x.dup ? "disabled" : ""}>${opts(x.driverId)}</select>${x.how ? `<div class="small muted">matched by ${x.how}</div>` : ""}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="row-actions"><button class="btn primary" data-action="imp-go" ${sel.length && S.canWrite ? "" : "disabled"}>Import ${sel.length} payment${sel.length === 1 ? "" : "s"} (${ksh(sel.reduce((t, x) => t + x.amount, 0))})</button></div>`;
}

async function runImport() {
  const sel = IMP.rows.filter(x => x.include && x.driverId);
  let n = 0;
  const btn = document.querySelector('[data-action="imp-go"]'); if (btn) { btn.disabled = true; btn.textContent = "Importing…"; }
  const touched = new Set();
  for (const x of sel) {
    const a = driverAssignOn(x.driverId, x.date);
    const data = { date: x.date, driverId: x.driverId, carId: a ? a.carId : "", amount: x.amount, method: /paybill/i.test(IMP.file) ? "M-Pesa Paybill" : "M-Pesa Till", ref: x.ref, note: "Imported" + (x.party ? " · " + x.party.slice(0, 60) : ""), updatedAt: new Date().toISOString() };
    const col = S.db.collection(`months/${monthOf(x.date)}/payments`);
    const ok = await save(() => (x.id ? col.doc(x.id) : col.doc()).set(data));
    if (!ok) break;
    n++; touched.add(monthOf(x.date));
  }
  touched.forEach(m => refreshMonth(m, "payments"));
  toast(`Imported ${n} payment${n === 1 ? "" : "s"}`);
  IMP = null; S.view = "collect"; location.hash = "collect"; render();
}

/* ============ Statement ============ */
function statementText(id) {
  const d = S.calc.drivers.find(x => x.id === id); if (!d) return "";
  const T = todayStr(), from = (() => { const f = addDays(T, -13); return f < trackStart() ? trackStart() : f; })();
  const pays = all("payments").filter(p => p.driverId === id && p.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  const chg = all("expenses").filter(x => x.chargeDriver && x.driverId === id && x.date >= from);
  const lines = [];
  lines.push(`${S.settings.name || "DRYV"}: statement for ${d.name}`);
  if (d.assign) lines.push(`Car ${carLabel(d.assign.carId)} · ${ksh(d.rate)} per day`);
  lines.push(`As at ${fmtDate(T)}`);
  if (d.days.charged) { lines.push(`Days to pay for since ${fmtShort(d.days.first)}: ${d.days.charged} · paid: ${d.days.paidDays} · unpaid: ${Math.max(0, d.days.unpaidDays)}`); if (d.days.paidUpTo && d.days.unpaidDays > 0) lines.push(`Paid up to ${fmtDate(d.days.paidUpTo)}`); }
  lines.push("");
  lines.push(`Payments since ${fmtShort(from)}:`);
  if (!pays.length) lines.push("  none");
  pays.forEach(p => lines.push(`  ${fmtShort(p.date)}  ${ksh(p.amount)}${p.ref ? "  (" + p.ref + ")" : ""}`));
  const cr = all("expenses").filter(x => x.paidByDriver && x.driverId === id && x.date >= from);
  if (cr.length) { lines.push(""); lines.push("Car costs you paid (deducted):"); cr.forEach(x => lines.push(`  ${fmtShort(x.date)}  ${x.category}  ${ksh(x.amount)}${x.note ? " · " + x.note : ""}`)); }
  if (chg.length) { lines.push(""); lines.push("Charges:"); chg.forEach(x => lines.push(`  ${fmtShort(x.date)}  ${x.category}  ${ksh(x.amount)}${x.note ? " · " + x.note : ""}`)); }
  lines.push("");
  lines.push(d.balance > 1 ? `Balance owed: ${ksh(d.balance)} (about ${d.daysBehind.toFixed(1)} days)` : d.balance < -1 ? `You are ${ksh(-d.balance)} in credit. Thank you.` : "You are fully paid up. Thank you.");
  return lines.join("\n");
}

function fieldHtml(f) {
  const id = "f-" + f.id, v = f.value ?? "";
  if (f.type === "check") return `<label class="ck" for="${id}"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(f.label)}</label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}`;
  let input;
  if (f.type === "select") input = `<select id="${id}" ${f.required ? "required" : ""}>${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
  else input = `<input id="${id}" type="${f.type || "text"}" value="${esc(v)}" ${f.required ? "required" : ""} ${f.min ? `min="${f.min}"` : ""} ${f.type === "number" ? 'inputmode="decimal" step="any"' : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
  return `<label class="fl" for="${id}">${esc(f.label)}${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</label>`;
}
let FORM = null;
function openForm(title, fields, onSubmit, opts = {}) {
  FORM = { fields, onSubmit, onDelete: opts.onDelete };
  const rows = []; for (let i = 0; i < fields.length; i++) { const f = fields[i]; if (f.half && fields[i + 1] && fields[i + 1].half) { rows.push(`<div class="two">${fieldHtml(f)}${fieldHtml(fields[i + 1])}</div>`); i++; } else rows.push(fieldHtml(f)); }
  openSheet(title, `<form class="f" id="the-form" novalidate>${opts.intro ? `<div class="small muted" style="margin:0">${opts.intro}</div>` : ""}${rows.join("")}<div class="err" id="form-err"></div>
  <div class="row-actions"><button class="btn primary" type="submit">Save</button>${opts.onDelete ? `<button class="btn danger" type="button" data-action="form-delete">Delete</button>` : ""}</div></form>`);
  const onChange = opts.onChange; if (onChange) { document.getElementById("the-form").addEventListener("change", e => onChange(e, formVals())); }
}
function formVals() {
  const o = {}; for (const f of FORM.fields) { const el = document.getElementById("f-" + f.id); if (!el) continue; o[f.id] = f.type === "check" ? el.checked : f.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value.trim(); } return o;
}

function formAssign(pre, rec, ext = {}) {
  const T = todayStr(); const r = rec || ext.prefill || {};
  const carId = r.carId || (pre && pre.startsWith("car:") ? pre.slice(4) : "");
  const driverId = r.driverId || (pre && pre.startsWith("driver:") ? pre.slice(7) : "");

  const carChoices = ext.prefill ? [["", "Choose car"]].concat(S.cars.map(c => [c.id, c.plate + (c.soldDate && c.soldDate <= T ? " (sold)" : "") + (c.make ? " · " + c.make + " " + (c.model || "") : "")])) : carOpts("Choose car");
  openForm(rec ? "Edit assignment" : ext.title || "Assign driver to car", [
    { id: "carId", label: "Car", type: "select", options: carChoices, value: carId, required: true },
    { id: "driverId", label: "Driver", type: "select", options: driverOpts("Choose driver"), value: driverId, required: true },
    { id: "rate", label: "Daily rate (KSh)", type: "number", value: r.rate ?? prevRate, required: true, half: true },
    { id: "restDay", label: "Rest day", type: "select", options: [["", "No rest day"]].concat(DAYS.map((d, i) => [String(i), d])), value: r.restDay ?? "0", half: true },
    { id: "start", label: "Starts on", type: "date", value: r.start || T, half: true },
    { id: "end", label: "Ended on", type: "date", value: r.end || "", half: true, hint: "Leave empty while ongoing" }
  ], async v => {
    if (!v.carId || !v.driverId) return "Choose both the car and the driver";
    if (!(v.rate > 0)) return "Enter the daily rate";
    if (v.end && v.end < v.start) return "End date is before the start date";
    const overlaps = (a) => a.id !== r.id && a.start <= (v.end || "9999") && (!a.end || a.end >= v.start);
    const ops = [];
    // Auto-close the open assignment for this car / this driver that started earlier
    for (const a of S.assigns.filter(a => overlaps(a) && (a.carId === v.carId || a.driverId === v.driverId))) {
      if (!a.end && a.start < v.start) ops.push(() => S.db.collection("assignments").doc(a.id).update({ end: addDays(v.start, -1) }));
      else return `${a.carId === v.carId ? "This car" : "This driver"} already has an assignment from ${fmtDate(a.start)}${a.end ? " to " + fmtDate(a.end) : ""}. Edit that one first.`;
    }
    const ref = rec ? S.db.collection("assignments").doc(rec.id) : S.db.collection("assignments").doc();
    return save(async () => { for (const op of ops) await op(); await ref.set({ ...v, restDay: v.restDay === "" ? "" : Number(v.restDay), updatedAt: new Date().toISOString() }); }, "Assignment saved");
  }, { intro: rec ? "" : ext.intro || "If the car or driver already has an open assignment, it will end the day before this one starts.", onDelete: rec ? () => save(() => S.db.collection("assignments").doc(rec.id).delete(), "Assignment deleted") : null });
}

const ISSUES = ["Breakdown / mechanical", "Accident", "Police / fine", "Platform account problem", "Other"];
function reviewSection() {
  const p = S.pending.slice().sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
  if (!p.length) return "";
  const known = new Set(all("payments").map(x => x.id));
  return `<div class="section"><div class="section-head"><h2>To review</h2><span class="small muted">${p.length} from drivers</span></div><div class="list">${p.map(s => {
    const who = esc(driverName(s.driverId));
    const a = driverAssignOn(s.driverId, s.date || todayStr()) || currentAssignForDriver(s.driverId);
    const car = a ? plate(carLabel(a.carId)) : "";
    let t, d, extra = "";
    if (s.type === "payment") { const rid = recordId(s.ref); t = `${who} says they paid ${ksh(s.amount)}`; d = `${fmtDate(s.date)}${s.ref ? " · " + esc(s.ref) : ""}`; if (rid && known.has(rid)) extra = `<div>${pill("neutral", "Already recorded")}</div>`; }
    else if (s.type === "mileage") { t = `${who}: mileage ${Number(s.km).toLocaleString()} km`; d = fmtDate(s.date); }
    else { t = `${who} reports: ${esc(s.issue)}`; d = `${fmtDate(s.date)}${s.offRoad ? " · car can't work" : ""}`; }
    const okLabel = s.type === "issue" && !s.offRoad ? "Mark handled" : "Approve";
    return `<div class="li"><div class="main"><div class="t">${t} ${car}</div><div class="small muted">${d}${s.note ? " · “" + esc(s.note) + "”" : ""}</div>${extra}</div><div class="end">${S.canWrite ? `<button class="btn primary sm" data-action="sub-ok" data-v="${esc(s.id)}">${okLabel}</button><button class="btn sm" data-action="sub-no" data-v="${esc(s.id)}">Reject</button>` : ""}</div></div>`;
  }).join("")}</div><div class="small muted">Approving adds the payment, mileage or off-road days to the records. The driver sees the result in their app.</div></div>`;
}
function markSub(s, status, note) {

async function approveSub(id) {
  const s = S.pending.find(x => x.id === id); if (!s) return;
  const a = driverAssignOn(s.driverId, s.date || todayStr()) || currentAssignForDriver(s.driverId);
  if (s.type === "payment") {
    const rid = recordId(s.ref);
    if (rid && all("payments").some(p => p.id === rid)) { toast("This M-Pesa code is already recorded. Reject this update instead."); return; }
    if (!s.date || s.date < trackStart()) { toast("The date is before your tracking start date"); return; }
    const data = { date: s.date, driverId: s.driverId, carId: a ? a.carId : "", amount: Number(s.amount) || 0, method: "M-Pesa Till", ref: s.ref || "", note: "Reported by driver" + (s.note ? " · " + s.note : "") };
    await save(async () => { await writeRecord("payments", data); await markSub(s, "approved"); }, "Payment approved");
  } else if (s.type === "mileage") {
    if (!a) { toast("This driver has no car assigned"); return; }
    await save(async () => { await writeRecord("odo", { carId: a.carId, km: Number(s.km) || 0, date: s.date }); await markSub(s, "approved"); }, "Mileage approved");
  } else if (s.offRoad) {
    const reason = /accident/i.test(s.issue) ? "Accident" : /breakdown|mechanical/i.test(s.issue) ? "Service / repair" : /platform/i.test(s.issue) ? "Platform suspension" : "Other";
    const r = DOWN_REASONS.find(x => x.v === reason);
    formDowntime(a ? a.carId : "", null, { prefill: { reason, from: s.date, excused: r ? r.excused : true, note: String(s.issue + (s.note ? ": " + s.note : "")).slice(0, 200) }, after: () => markSub(s, "approved") });

/* ============ Driver summaries (written by the family app, read by drivers) ============ */
const hashStr = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h >>> 0); };
function buildSummary(d) {
  const pays = all("payments").filter(p => p.driverId === d.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20).map(p => ({ date: p.date, amount: Number(p.amount) || 0, ref: p.ref || "" }));
  const since = addDays(todayStr(), -60);
  const chg = all("expenses").filter(x => x.chargeDriver && x.driverId === d.id && x.date >= since).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10).map(x => ({ date: x.date, category: x.category || "", amount: Number(x.amount) || 0, note: x.note || "" }));
  return { driverId: d.id, name: d.name || "", bizName: S.settings.name || "", plate: d.assign ? carLabel(d.assign.carId) : "", rate: d.rate || 0, restDay: d.assign ? d.assign.restDay : "", balance: Math.round(d.balance), daysBehind: Math.round((d.daysBehind || 0) * 10) / 10, asOf: todayStr(), payments: pays, charges: chg, credits: all("expenses").filter(x => x.paidByDriver && x.driverId === d.id && x.date >= since).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10).map(x => ({ date: x.date, category: x.category || "", amount: Number(x.amount) || 0, note: x.note || "" })), days: { first: d.days.first || "", worked: d.days.worked, charged: d.days.charged, paid: d.days.paidDays, unpaid: Math.max(0, d.days.unpaidDays), paidUpTo: d.days.paidUpTo || "" } };
}
let summaryBusy = false;
async function syncSummaries() {
  if (S.mode !== "family" || !S.canWrite || summaryBusy || !S.calc || !allConfirmed()) return;
  const writes = [];
  for (const d of S.calc.drivers) {
    if (!d.loginEmail) continue;
    const sum = buildSummary(d), hash = hashStr(JSON.stringify(sum));
    if (S.summaries[d.id] && S.summaries[d.id].hash === hash) continue;
    writes.push([d.id, { ...sum, hash, updatedAt: new Date().toISOString() }]);
  }
  if (!writes.length) return;
  summaryBusy = true;
  try {
    for (const [id, data] of writes) {
      S.summaries[id] = data; // avoid rewriting while the write is in flight
      await Promise.race([S.db.collection("driverSummaries").doc(id).set(data), new Promise(r => setTimeout(r, 8000))]);
    }
  } catch (e) {} finally { summaryBusy = false; }
}

/* ============ Settle and close a driver ============ */
function lastAssign(id) { return S.assigns.filter(a => a.driverId === id).sort((a, b) => b.start.localeCompare(a.start))[0]; }
function startSettle(id) {
  const d = driverById(id); if (!d) return;
  const open = S.assigns.find(a => a.driverId === id && (!a.end || a.end >= todayStr()));
  if (open) {
    openForm(`Settle ${d.name}: last working day`, [
      { id: "end", label: "Last day the driver had the car", type: "date", value: addDays(todayStr(), -1), required: true }
    ], async v => {
      if (!v.end || v.end < open.start) return "The last day can't be before the assignment started (" + fmtDate(open.start) + ")";
      const ok = await save(() => S.db.collection("assignments").doc(open.id).update({ end: v.end }), "Assignment ended");
      if (ok) setTimeout(() => openSettle(id), 500);
      return ok;
    }, { intro: `${esc(d.name)} still has ${plate(carLabel(open.carId))}. First end the assignment so no more daily rates are charged. The car will show as having no driver until you assign someone else.` });
    return;
  }
  openSettle(id);
}
function openSettle(id) {
  S.calc = compute();
  const d = S.calc.drivers.find(x => x.id === id); if (!d) return;
  const rec = driverById(id), dep = Number(rec.deposit) || 0, bal = Math.round(d.balance);
  const hasHistory = S.assigns.some(a => a.driverId === id);
  const T = todayStr();
  const fields = [
    { id: "date", label: "Settlement date", type: "date", value: T < trackStart() ? trackStart() : T, half: true, min: trackStart() },
    { id: "how", label: "Paid / refunded by", type: "select", options: ["M-Pesa", "Cash", "Bank"], value: "M-Pesa", half: true },
    { id: "useDeposit", label: `Use the deposit (${ksh(dep)}) against the balance`, type: "check", value: dep > 0, hint: dep > 0 ? "The deposit counts as money you keep. If the driver is in credit, it is refunded together with the credit." : "No deposit is recorded for this driver." },
    { id: "outcome", label: "What happens to the rest", type: "select", options: [["keep", "Leave the balance open"]], value: "keep" },
    { id: "note", label: "Note", value: "" }
  ];
  const netOf = v => bal - (v.useDeposit ? dep : 0);
  const optsFor = net => net > 1 ? [["collect", "Driver pays it now"], ["writeoff", "Write it off (won't be collected)"], ["keep", "Leave it open as a debt"]]
    : net < -1 ? [["refund", "Refund the driver now"], ["keep", "Leave it open as a credit"]] : [["none", "Nothing left: close the account"]];
  const summary = v => {
    const net = netOf(v);
    const line = (l, x, strong) => `<div style="display:flex;justify-content:space-between;gap:10px"><span>${l}</span><b class="num" style="${strong ? "font-size:16px" : "font-weight:600"}">${x}</b></div>`;
    return `<div class="card" style="display:grid;gap:6px;background:var(--bg)">
      ${line("Balance now", bal > 1 ? ksh(bal) + " owed" : bal < -1 ? ksh(-bal) + " credit" : "KSh 0")}
      ${v.useDeposit && dep ? line("Deposit kept", "− " + ksh(dep)) : ""}
      ${line(net > 1 ? "Driver still owes" : net < -1 ? "You owe the driver" : "Left to settle", ksh(Math.abs(net)), true)}
    </div>${!hasHistory ? `<div class="err" style="margin-top:8px">This driver has never been assigned to a car, so no daily rates were charged and every payment shows as credit. Add his past assignment (car, rate, start and end dates) before settling.</div>` : bal < -1 ? `<div class="small muted" style="margin-top:8px">Credit often means the assignment dates are wrong. Check them under Cars driven before refunding.</div>` : ""}`;
  };
  openForm(`Settle and close: ${d.name}`, fields, async v => {
    const net = netOf(v), car = (lastAssign(id) || {}).carId || "";
    const valid = optsFor(net).map(o => o[0]); if (!valid.includes(v.outcome)) v.outcome = valid[0];
    if (!v.date) return "Choose the settlement date";
    const recs = [];
    if (v.useDeposit && dep) recs.push({ date: v.date, driverId: id, carId: car, amount: dep, method: "Deposit", ref: "", note: "Deposit kept at settlement" });
    let summaryText = "";
    if (v.outcome === "collect") { recs.push({ date: v.date, driverId: id, carId: car, amount: net, method: v.how === "M-Pesa" ? "M-Pesa Till" : v.how, ref: "", note: "Final payment at settlement" }); summaryText = `final payment ${ksh(net)}`; }
    else if (v.outcome === "refund") { recs.push({ date: v.date, driverId: id, carId: car, amount: net, method: "Refund", ref: "", note: `Refunded by ${v.how} at settlement` }); summaryText = `refunded ${ksh(-net)}`; }
    else if (v.outcome === "writeoff") summaryText = `wrote off ${ksh(net)}`;
    else if (v.outcome === "keep") summaryText = net > 1 ? `${ksh(net)} still owed` : `${ksh(-net)} credit left open`;
    else summaryText = "nothing left to pay";
    if (v.useDeposit && dep) summaryText = `deposit ${ksh(dep)} kept, ` + summaryText;
    const adjustments = (Array.isArray(rec.adjustments) ? rec.adjustments : []).concat(v.outcome === "writeoff" ? [{ date: v.date, amount: net, note: "Written off at settlement" + (v.note ? " · " + v.note : "") }] : []);
    const ok = await save(async () => {
      for (const r of recs) await writeRecord("payments", r);
      await S.db.collection("drivers").doc(id).update({ status: "left", leftDate: (lastAssign(id) || {}).end || v.date, deposit: v.useDeposit ? 0 : dep, adjustments, loginEmail: "", settlement: { date: v.date, summary: summaryText + (v.note ? " · " + v.note : ""), by: (S.user && S.user.email) || "" }, updatedAt: new Date().toISOString() });
      if (rec.loginEmail) await S.db.collection("driverLogins").doc(String(rec.loginEmail).toLowerCase()).delete();
    }, "Driver settled and closed");
    if (ok && rec.loginEmail) setTimeout(() => toast("Also delete " + rec.loginEmail + " in Firebase > Authentication"), 3000);
    return ok;
  }, {
    intro: `<span id="settle-sum">${summary({ useDeposit: dep > 0 })}</span>`,
    onChange: (e, v) => { document.getElementById("settle-sum").innerHTML = summary(v); syncOutcome(v); }
  });
  const syncOutcome = v => { const sel = document.getElementById("f-outcome"); const opts = optsFor(netOf(v)); const cur = sel.value; sel.innerHTML = opts.map(([k, l]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(l)}</option>`).join(""); };
  syncOutcome({ useDeposit: dep > 0 });
}

    case "drv-issue": drvIssue(); break;
    case "signout": firebase.auth().signOut().then(() => location.reload()); break;
    case "reset-pass": { const em = document.getElementById("login-email").value.trim(); if (!em) { document.getElementById("login-err").textContent = "Type your email first, then tap Forgot password."; break; } try { await firebase.auth().sendPasswordResetEmail(em); document.getElementById("login-err").textContent = "Password reset email sent to " + em; } catch (er) { document.getElementById("login-err").textContent = authMsg(er); } break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "imp-file" && el.files[0]) handleImportFile(el.files[0]);
  if (el.dataset.action === "imp-toggle") { IMP.rows[+el.dataset.v].include = el.checked; render(); }
  if (el.dataset.action === "imp-driver") { const r = IMP.rows[+el.dataset.v]; r.driverId = el.value; r.how = el.value ? "you" : ""; r.include = !!el.value && !r.dup && !!r.date; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "login-form") {
    e.preventDefault();
    try { await firebase.auth().signInWithEmailAndPassword(document.getElementById("login-email").value.trim(), document.getElementById("login-pass").value); }
    catch (er) { document.getElementById("login-err").textContent = authMsg(er); }
    return;
  }
  if (e.target.id !== "the-form") return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  const res = await FORM.onSubmit(formVals());
  btn.disabled = false;
  if (typeof res === "string") { document.getElementById("form-err").textContent = res; return; }
  if (res) closeSheet();
});
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function route() {
  const h = (location.hash || "#home").slice(1);
  const valid = ["home", "collect", "cars", "drivers", "more", "import", "settings"];
  const nv = valid.includes(h) ? h : "home";
  if (nv !== S.view) { if (!(S.detail && ((nv === "cars" && S.detail.startsWith("car:")) || (nv === "drivers" && S.detail.startsWith("driver:"))))) S.detail = null; }
  S.view = nv;
  render();
}
window.addEventListener("hashchange", route);
S.view = (location.hash || "#home").slice(1) || "home";
boot();
</script>
</body>
</html>
